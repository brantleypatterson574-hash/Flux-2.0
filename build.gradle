plugins {
    id 'net.fabricmc.fabric-loom-remap' apply false
    id 'net.fabricmc.fabric-loom' apply false
    id 'maven-publish'
}

// A version profile is a plain gradle.properties overlay. Invoke a build with
// -PtargetVersion=26.3 (or -Pminecraft_version=26.3) to select one; the default
// project stays on the recommended 1.21.11 release.
def requestedVersion = (findProperty('targetVersion') ?: findProperty('minecraft_version') ?: '1.21.11').toString()
def versionProfile = file("versions/${requestedVersion}/gradle.properties")
if (versionProfile.isFile()) {
    def profile = new Properties()
    versionProfile.withInputStream { profile.load(it) }
    def cliProperties = gradle.startParameter.projectProperties
    profile.each { key, value ->
        if (!cliProperties.containsKey(key.toString())) {
            project.ext.set(key.toString(), value.toString())
        }
    }
}

def targetMinecraft = project.minecraft_version.toString()
def is26 = targetMinecraft.startsWith('26.')
def isDefaultBuild = targetMinecraft == '1.21.11'
// Keep the remap pipeline for 26.x too: the generated Tiny jar maps official
// 26.x names to the Yarn 1.21.11 names used by this shared source tree.
apply plugin: 'net.fabricmc.fabric-loom-remap'

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mods {
        "utilmod" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

// The 26.x profiles ship generated Tiny mappings from official game names to
// the Yarn names this source tree uses. 1.21.11 keeps the standard Yarn setup.
if (is26) {
    if (!project.hasProperty('mapping_file')) {
        throw new GradleException("26.x profile ${targetMinecraft} is missing mapping_file")
    }
    // Compile the generated overlay instead of the 1.21.11 source tree. The
    // overlay is a mechanical copy with 26.x API substitutions; src/main/java
    // stays byte-for-byte identical for the recommended release.
    sourceSets.main.java.setSrcDirs([
        file('build/generated26/java'),
        file('src/compat26/java')
    ])
    tasks.register('prepare26Source', Exec) {
        group = 'flux'
        description = 'Generates the 26.x source overlay from the shared 1.21.11 sources.'
        workingDir rootDir
        commandLine 'python', file('versions/tools/prepare_26_source.py').absolutePath, targetMinecraft
        outputs.upToDateWhen { false }
    }
    tasks.named('compileJava') {
        dependsOn 'prepare26Source'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (is26) {
        mappings files(file(project.mapping_file))
    } else {
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

def targetJava = (project.findProperty('java_toolchain') ?: '21') as int
tasks.withType(JavaCompile).configureEach {
    it.options.release = targetJava
}

java {
    sourceCompatibility = JavaVersion.toVersion(targetJava)
    targetCompatibility = JavaVersion.toVersion(targetJava)
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJava)
    }
}

// Regenerate the original high-resolution menu icons before the previews use them.
tasks.register('generateIcons', Exec) {
    group = 'flux'
    description = 'Regenerates the smooth 64x64 category icons used by the ClickGUI.'
    workingDir rootDir
    commandLine 'python', file('mockups/generate_icons.py').absolutePath
    outputs.upToDateWhen { false }
}

// Regenerate the ClickGUI previews on every build so they track GUI/font edits.
tasks.register('generateMockups', Exec) {
    group = 'flux'
    description = 'Regenerates the ClickGUI mockup PNGs with the current theme and font.'
    workingDir rootDir
    commandLine 'python', file('mockups/render_clickgui_mockup.py').absolutePath
    dependsOn 'generateIcons'
    // Review artifacts: always refresh, even when the script itself has not changed.
    outputs.upToDateWhen { false }
}

// Regenerate the standalone website screenshots on every build as well.
tasks.register('generateSiteMockups', Exec) {
    group = 'flux'
    description = 'Regenerates the Onyx website gallery images with drawn-geometry chevrons.'
    workingDir rootDir
    commandLine 'python', file('mockups/render_site_mockup.py').absolutePath
    dependsOn 'generateIcons'
    outputs.upToDateWhen { false }
}

def websiteDir = file('website')
// Every profile is compiled against Yarn-style names. remapJar produces the
// production artifact (obfuscated names for 1.21.11, official names for 26.x).
def primaryJarTask = tasks.named('remapJar')
def builtJarFile = primaryJarTask.flatMap { it.archiveFile }
def builtJarPath = builtJarFile.get().asFile.absolutePath

def versionManifest = file(
    isDefaultBuild ? 'website/downloads/manifest.json' : "website/downloads/${targetMinecraft}/manifest.json"
)
def siteOutputs = [file('website/downloads/versions.json')]
if (isDefaultBuild) {
    siteOutputs << file('website/downloads/flux-2.0.jar')
    siteOutputs << file('website/downloads/manifest.json')
    siteOutputs << file('website/index.html')
} else {
    siteOutputs << file("website/downloads/${targetMinecraft}/manifest.json")
    siteOutputs << file("website/downloads/${targetMinecraft}/flux-2.0-${targetMinecraft}.jar")
}

// Keep the interactive site preview in sync with the client's real themes,
// module names, categories and branding. Runs on every build.
tasks.register('updateWebsitePreview', Exec) {
    group = 'flux'
    description = 'Regenerates website/preview.html from the current client sources.'
    workingDir rootDir
    commandLine 'python', file('website/generate_preview.py').absolutePath
    outputs.upToDateWhen { false }
}

// One publisher for every profile. The default build refreshes the legacy
// root jar and the visible index; 26.x builds only add their versioned entry.
def registerSiteTask = { String taskName ->
    tasks.register(taskName, Exec) {
        group = 'flux'
        description = "Copies the built ${targetMinecraft} jar into website/downloads and refreshes its manifest."
        dependsOn primaryJarTask, 'updateWebsitePreview'
        workingDir rootDir
        commandLine 'python', file('website/update_download.py').absolutePath,
            builtJarPath, websiteDir.absolutePath, targetMinecraft
        inputs.file builtJarFile
        outputs.files(*siteOutputs)
        outputs.upToDateWhen { false }
    }
}
registerSiteTask('updateWebsiteDownload')
registerSiteTask('updateVersionDownload')

// Announce each successful build in Discord. The webhook URL is read from the
// DISCORD_WEBHOOK_URL environment variable or config/discord_webhook.enc;
// config/ is gitignored so the secret is never committed.
def registerDiscordTask = { String taskName, String siteTaskName ->
    tasks.register(taskName, Exec) {
        group = 'flux'
        description = "Posts a ${targetMinecraft} build update to the configured Discord webhook."
        dependsOn siteTaskName
        workingDir rootDir
        commandLine 'python', file('scripts/discord_update.py').absolutePath,
            '--version', targetMinecraft,
            '--jar', builtJarPath,
            '--manifest', versionManifest.absolutePath
        ignoreExitValue = true
    }
}
registerDiscordTask('postDiscordUpdate', 'updateWebsiteDownload')
registerDiscordTask('postVersionDiscordUpdate', 'updateVersionDownload')

def activeSiteTask = isDefaultBuild ? 'updateWebsiteDownload' : 'updateVersionDownload'
def activeDiscordTask = isDefaultBuild ? 'postDiscordUpdate' : 'postVersionDiscordUpdate'

tasks.named('build') {
    dependsOn 'generateMockups', 'generateSiteMockups', activeSiteTask, activeDiscordTask
}
